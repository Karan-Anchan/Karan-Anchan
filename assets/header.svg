<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Karan Anchan, machine learning research and engineering</title>
  <desc id="desc">A research dashboard showing measured results from reinforcement learning, edge inference, and retrieval systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f" />
      <stop offset="0.58" stop-color="#0b1324" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" />
      <stop offset="1" stop-color="#a3e635" />
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#94a3b8" stroke-opacity="0.07" stroke-width="1" />
    </pattern>
    <clipPath id="frame">
      <rect width="1200" height="390" rx="24" />
    </clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="390" fill="url(#bg)" />
    <rect width="1200" height="390" fill="url(#grid)" />
    <circle cx="1050" cy="-40" r="260" fill="#22d3ee" opacity="0.055" />
    <circle cx="1150" cy="420" r="290" fill="#a3e635" opacity="0.04" />

    <g font-family="Inter, Segoe UI, Arial, sans-serif">
      <g transform="translate(58 52)">
        <rect width="318" height="30" rx="15" fill="#0e2936" stroke="#155e75" />
        <circle cx="18" cy="15" r="4" fill="#67e8f9" />
        <text x="32" y="20" fill="#a5f3fc" font-size="12" font-weight="700" letter-spacing="1.7">ML RESEARCH + ENGINEERING</text>
      </g>

      <text x="58" y="151" fill="#f8fafc" font-size="65" font-weight="780" letter-spacing="-2.6">Karan Anchan</text>
      <text x="60" y="195" fill="#94a3b8" font-size="20">I reproduce papers, test the failure mode, and ship the result.</text>

      <g transform="translate(60 232)">
        <path d="M0 34 C58 4 93 58 144 27 S245 9 300 27 S396 58 456 22 S558 3 638 25" fill="none" stroke="#1e3a4a" stroke-width="7" stroke-linecap="round" />
        <path d="M0 34 C58 4 93 58 144 27 S245 9 300 27 S396 58 456 22 S558 3 638 25" fill="none" stroke="url(#signal)" stroke-width="2.5" stroke-linecap="round" />
        <g fill="#0b1324" stroke="#67e8f9" stroke-width="2">
          <circle cx="0" cy="34" r="5" />
          <circle cx="144" cy="27" r="5" />
          <circle cx="300" cy="27" r="5" />
          <circle cx="456" cy="22" r="5" />
          <circle cx="638" cy="25" r="5" />
        </g>
        <text x="0" y="64" fill="#64748b" font-size="11" letter-spacing="1.2">QUESTION</text>
        <text x="125" y="64" fill="#64748b" font-size="11" letter-spacing="1.2">BASELINE</text>
        <text x="276" y="64" fill="#64748b" font-size="11" letter-spacing="1.2">RUNS</text>
        <text x="418" y="64" fill="#64748b" font-size="11" letter-spacing="1.2">SYSTEM</text>
        <text x="588" y="64" fill="#64748b" font-size="11" letter-spacing="1.2">EVIDENCE</text>
      </g>

      <g transform="translate(60 328)" font-size="12" font-weight="650" letter-spacing="0.8">
        <rect width="206" height="34" rx="17" fill="#101d31" stroke="#26364d" />
        <text x="18" y="22" fill="#cbd5e1">REINFORCEMENT LEARNING</text>
        <rect x="220" width="188" height="34" rx="17" fill="#101d31" stroke="#26364d" />
        <text x="239" y="22" fill="#cbd5e1">EFFICIENT INFERENCE</text>
        <rect x="422" width="180" height="34" rx="17" fill="#101d31" stroke="#26364d" />
        <text x="443" y="22" fill="#cbd5e1">RETRIEVAL SYSTEMS</text>
      </g>

      <line x1="770" y1="48" x2="770" y2="342" stroke="#334155" stroke-opacity="0.72" />
      <text x="812" y="50" fill="#64748b" font-size="11" font-weight="700" letter-spacing="1.8">SELECTED MEASUREMENTS</text>

      <g transform="translate(812 72)">
        <rect width="330" height="78" rx="14" fill="#101b2d" stroke="#26364d" />
        <rect width="5" height="78" rx="2.5" fill="#67e8f9" />
        <text x="24" y="25" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.4">RLPD</text>
        <text x="24" y="57" fill="#f8fafc" font-size="29" font-weight="760">88 to 90%</text>
        <text x="182" y="55" fill="#94a3b8" font-size="13">of Minari v5 expert</text>
      </g>

      <g transform="translate(812 162)">
        <rect width="330" height="78" rx="14" fill="#101b2d" stroke="#26364d" />
        <rect width="5" height="78" rx="2.5" fill="#a3e635" />
        <text x="24" y="25" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.4">EDGE INFERENCE</text>
        <text x="24" y="57" fill="#f8fafc" font-size="29" font-weight="760">560 FPS</text>
        <text x="165" y="55" fill="#94a3b8" font-size="13">FP8 on RTX 5070</text>
      </g>

      <g transform="translate(812 252)">
        <rect width="330" height="78" rx="14" fill="#101b2d" stroke="#26364d" />
        <rect width="5" height="78" rx="2.5" fill="#c4b5fd" />
        <text x="24" y="25" fill="#94a3b8" font-size="12" font-weight="700" letter-spacing="1.4">RETRIEVAL SYSTEM</text>
        <text x="24" y="57" fill="#f8fafc" font-size="29" font-weight="760">93.4%</text>
        <text x="142" y="55" fill="#94a3b8" font-size="13">mean groundedness</text>
      </g>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="388.5" rx="23.25" fill="none" stroke="#334155" stroke-width="1.5" />
  </g>
</svg>
