<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Research workflow</title>
  <desc id="desc">Five steps: define the question, reproduce the baseline, run controlled experiments, measure the system, and document the limits.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="220" rx="20" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="220" fill="url(#background)" />
    <g fill="none" stroke-width="1.1" opacity="0.11">
      <path d="M870 -6 C948 45 1024 10 1100 39 C1145 56 1178 76 1224 108" stroke="#65c7f7" />
      <path d="M920 -20 C990 27 1061 0 1135 27 C1174 41 1204 60 1233 82" stroke="#b7a6ff" />
    </g>

    <g font-family="Segoe UI, Arial, sans-serif">
      <g transform="translate(42 27)">
        <path d="M0 12 C0 4 7 0 15 2 C14 10 9 14 0 12Z" fill="#a3d977" />
        <text x="27" y="12" fill="#8b96a5" font-size="10.5" font-weight="700" letter-spacing="1.55">RESEARCH WORKFLOW</text>
      </g>

      <g transform="translate(42 61)">
        <rect width="267" height="3" rx="1.5" fill="#a3d977" />
        <rect x="277" width="267" height="3" rx="1.5" fill="#65c7f7" />
        <rect x="554" width="267" height="3" rx="1.5" fill="#f7c65d" />
        <rect x="831" width="285" height="3" rx="1.5" fill="#b7a6ff" />
      </g>

      <g>
        <line x1="230" y1="84" x2="230" y2="182" stroke="#2d3748" />
        <line x1="470" y1="84" x2="470" y2="182" stroke="#2d3748" />
        <line x1="710" y1="84" x2="710" y2="182" stroke="#2d3748" />
        <line x1="950" y1="84" x2="950" y2="182" stroke="#2d3748" />
      </g>

      <g transform="translate(48 92)">
        <circle cx="5" cy="5" r="5" fill="#a3d977" />
        <text x="18" y="9" fill="#8b96a5" font-size="10.5" font-weight="700" letter-spacing="1.2">01</text>
        <text y="47" fill="#f0f6fc" font-size="15" font-weight="700">Define the question</text>
        <text y="72" fill="#9ca9b8" font-size="12">metric, budget, failure mode</text>
      </g>
      <g transform="translate(288 92)">
        <circle cx="5" cy="5" r="5" fill="#65c7f7" />
        <text x="18" y="9" fill="#8b96a5" font-size="10.5" font-weight="700" letter-spacing="1.2">02</text>
        <text y="47" fill="#f0f6fc" font-size="15" font-weight="700">Reproduce the baseline</text>
        <text y="72" fill="#9ca9b8" font-size="12">same data and evaluation</text>
      </g>
      <g transform="translate(528 92)">
        <circle cx="5" cy="5" r="5" fill="#f7c65d" />
        <text x="18" y="9" fill="#8b96a5" font-size="10.5" font-weight="700" letter-spacing="1.2">03</text>
        <text y="47" fill="#f0f6fc" font-size="15" font-weight="700">Run controlled experiments</text>
        <text y="72" fill="#9ca9b8" font-size="12">seeds, ablations, provenance</text>
      </g>
      <g transform="translate(768 92)">
        <circle cx="5" cy="5" r="5" fill="#b7a6ff" />
        <text x="18" y="9" fill="#8b96a5" font-size="10.5" font-weight="700" letter-spacing="1.2">04</text>
        <text y="47" fill="#f0f6fc" font-size="15" font-weight="700">Measure the system</text>
        <text y="72" fill="#9ca9b8" font-size="12">latency, memory, power</text>
      </g>
      <g transform="translate(1008 92)">
        <circle cx="5" cy="5" r="5" fill="#65c7f7" />
        <text x="18" y="9" fill="#8b96a5" font-size="10.5" font-weight="700" letter-spacing="1.2">05</text>
        <text y="47" fill="#f0f6fc" font-size="15" font-weight="700">Document the limits</text>
        <text y="72" fill="#9ca9b8" font-size="12">artifacts and open questions</text>
      </g>
    </g>

    <rect x="0.75" y="0.75" width="1198.5" height="218.5" rx="19.25" fill="none" stroke="#30363d" stroke-width="1.5" />
  </g>
</svg>
