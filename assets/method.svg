<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="title desc">
  <title id="title">Research trail</title>
  <desc id="desc">Five trail markers: observe the question, reproduce the baseline, run controlled experiments, measure the system, and document the limits.</desc>
  <defs>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c3dc7e" />
      <stop offset="0.52" stop-color="#84cc79" />
      <stop offset="1" stop-color="#66c8b0" />
    </linearGradient>
    <pattern id="contours" width="300" height="160" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#afcf9d" stroke-opacity="0.065" stroke-width="1">
        <path d="M-30 35 C41 -5 96 19 132 49 S226 91 330 30" />
        <path d="M-42 55 C36 12 92 34 130 64 S227 107 342 49" />
        <path d="M-55 78 C31 33 88 51 128 81 S230 125 355 70" />
        <path d="M-65 104 C28 56 87 69 128 99 S234 144 368 94" />
      </g>
    </pattern>
  </defs>

  <rect width="1200" height="220" rx="20" fill="#09180f" />
  <rect width="1200" height="220" rx="20" fill="url(#contours)" />
  <path d="M120 99 C201 58 279 110 360 78 S520 70 600 103 S760 111 840 76 S999 61 1080 98" fill="none" stroke="#254936" stroke-width="9" stroke-linecap="round" />
  <path d="M120 99 C201 58 279 110 360 78 S520 70 600 103 S760 111 840 76 S999 61 1080 98" fill="none" stroke="url(#route)" stroke-width="2.5" stroke-linecap="round" />

  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g transform="translate(120 99)">
      <circle r="25" fill="#10291b" stroke="#bddb7e" stroke-width="2" />
      <text y="6" fill="#edf4d8" font-size="15" font-weight="750">01</text>
    </g>
    <g transform="translate(360 78)">
      <circle r="25" fill="#10291b" stroke="#a7d27a" stroke-width="2" />
      <text y="6" fill="#edf4d8" font-size="15" font-weight="750">02</text>
    </g>
    <g transform="translate(600 103)">
      <circle r="25" fill="#10291b" stroke="#8dcc7a" stroke-width="2" />
      <text y="6" fill="#edf4d8" font-size="15" font-weight="750">03</text>
    </g>
    <g transform="translate(840 76)">
      <circle r="25" fill="#10291b" stroke="#76cba0" stroke-width="2" />
      <text y="6" fill="#e2f4e9" font-size="15" font-weight="750">04</text>
    </g>
    <g transform="translate(1080 98)">
      <circle r="25" fill="#10291b" stroke="#64c7b0" stroke-width="2" />
      <text y="6" fill="#e2f4e9" font-size="15" font-weight="750">05</text>
    </g>

    <text x="120" y="154" fill="#f0f4e7" font-size="14" font-weight="700">Observe the question</text>
    <text x="120" y="176" fill="#789080" font-size="12">metric, budget, failure mode</text>
    <text x="360" y="154" fill="#f0f4e7" font-size="14" font-weight="700">Reproduce the baseline</text>
    <text x="360" y="176" fill="#789080" font-size="12">same data and evaluation</text>
    <text x="600" y="154" fill="#f0f4e7" font-size="14" font-weight="700">Run controlled experiments</text>
    <text x="600" y="176" fill="#789080" font-size="12">seeds, ablations, provenance</text>
    <text x="840" y="154" fill="#f0f4e7" font-size="14" font-weight="700">Measure the system</text>
    <text x="840" y="176" fill="#789080" font-size="12">latency, memory, power</text>
    <text x="1080" y="154" fill="#f0f4e7" font-size="14" font-weight="700">Document the limits</text>
    <text x="1080" y="176" fill="#789080" font-size="12">artifacts and open questions</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="218.5" rx="19.25" fill="none" stroke="#3a5f47" stroke-width="1.5" />
</svg>
