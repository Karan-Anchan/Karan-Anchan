<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="285" viewBox="0 0 1200 285" role="img" aria-labelledby="title desc">
  <title id="title">Working stack</title>
  <desc id="desc">Tools used for research, deployment, retrieval, and product engineering.</desc>
  <defs>
