      <stop offset="0" stop-color="#0d1117" />
      <stop offset="1" stop-color="#111827" />
    </linearGradient>
    <clipPath id="frame"><rect width="1200" height="285" rx="20" /></clipPath>
  </defs>

  <g clip-path="url(#frame)">
