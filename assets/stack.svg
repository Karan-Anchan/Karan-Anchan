<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="285" viewBox="0 0 1200 285" role="img" aria-labelledby="title desc">
  <title id="title">Working field kit</title>
  <desc id="desc">Tools used for research, deployment, retrieval, and product engineering in a nature-inspired field guide.</desc>
  <defs>
    <linearGradient id="branch" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2dc7f" />
      <stop offset="0.55" stop-color="#83cb79" />
      <stop offset="1" stop-color="#65c7ae" />
    </linearGradient>
    <pattern id="rings" width="310" height="220" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#b4d5a2" stroke-opacity="0.055" stroke-width="1">
        <ellipse cx="265" cy="40" rx="38" ry="27" />
        <ellipse cx="265" cy="40" rx="70" ry="50" />
        <ellipse cx="265" cy="40" rx="103" ry="74" />
        <ellipse cx="265" cy="40" rx="136" ry="98" />
        <ellipse cx="265" cy="40" rx="170" ry="124" />
      </g>
    </pattern>
  </defs>

  <rect width="1200" height="285" rx="20" fill="#09180f" />
  <rect width="1200" height="285" rx="20" fill="url(#rings)" />

  <g font-family="Segoe UI, Arial, sans-serif">
    <path d="M42 42 H1158" stroke="#2c503a" stroke-width="5" stroke-linecap="round" />
    <path d="M42 42 H1158" stroke="url(#branch)" stroke-width="2" stroke-linecap="round" />
    <path d="M58 42 C58 29 69 24 80 26 C78 38 70 45 58 42Z" fill="#a7d27b" />
    <path d="M61 41 C66 35 71 30 78 27" fill="none" stroke="#e3edc6" stroke-width="1.2" stroke-linecap="round" />
    <text x="94" y="35" fill="#d7e7bd" font-size="11" font-weight="750" letter-spacing="1.65">FIELD KIT // TOOLS I REACH FOR</text>

    <g transform="translate(42 82)">
      <text fill="#bddb7f" font-size="11.5" font-weight="750" letter-spacing="1.5">01 / RESEARCH</text>
      <text y="38" fill="#f0f4e7" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="700">PyTorch</text>
      <text y="70" fill="#c6d2c6" font-size="14">Gymnasium · MuJoCo · Minari</text>
      <text y="99" fill="#c6d2c6" font-size="14">Transformers · MONAI · W&amp;B</text>
      <text y="137" fill="#789080" font-size="12">training, ablations, multi-seed evaluation</text>
    </g>

    <line x1="318" y1="82" x2="318" y2="236" stroke="#2d4c38" />
    <g transform="translate(352 82)">
      <text fill="#a6d17b" font-size="11.5" font-weight="750" letter-spacing="1.5">02 / DEPLOYMENT</text>
      <text y="38" fill="#f0f4e7" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="700">ONNX · TensorRT</text>
      <text y="70" fill="#c6d2c6" font-size="14">ONNX Runtime · WebGPU</text>
      <text y="99" fill="#c6d2c6" font-size="14">NVML · GitHub Actions</text>
      <text y="137" fill="#789080" font-size="12">latency, throughput, power, client inference</text>
    </g>

    <line x1="626" y1="82" x2="626" y2="236" stroke="#2d4c38" />
    <g transform="translate(660 82)">
      <text fill="#82c997" font-size="11.5" font-weight="750" letter-spacing="1.5">03 / RETRIEVAL</text>
      <text y="38" fill="#f0f4e7" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="700">LangChain · ChromaDB</text>
      <text y="70" fill="#c6d2c6" font-size="14">document pipelines · vector search</text>
      <text y="99" fill="#c6d2c6" font-size="14">retrieval and groundedness evaluation</text>
      <text y="137" fill="#789080" font-size="12">production RAG over 5,000+ documents</text>
    </g>

    <line x1="932" y1="82" x2="932" y2="236" stroke="#2d4c38" />
    <g transform="translate(966 82)">
      <text fill="#69c6ad" font-size="11.5" font-weight="750" letter-spacing="1.5">04 / PRODUCT</text>
      <text y="38" fill="#f0f4e7" font-family="Georgia, Times New Roman, serif" font-size="19" font-weight="700">Python · TypeScript</text>
      <text y="70" fill="#c6d2c6" font-size="14">React · Next.js · Dexie</text>
      <text y="99" fill="#c6d2c6" font-size="14">SQL · Supabase · PWA</text>
      <text y="137" fill="#789080" font-size="12">demos, offline-first apps, technical writing</text>
    </g>

    <text x="42" y="258" fill="#607968" font-size="10.5" letter-spacing="1.2">FREIBURG FIELD EDITION // MEASURED ON ONE DESKTOP GPU</text>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="283.5" rx="19.25" fill="none" stroke="#3a5f47" stroke-width="1.5" />
</svg>
