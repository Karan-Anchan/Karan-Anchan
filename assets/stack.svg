<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc">
  <title id="title">Working stack</title>
  <desc id="desc">Tools used for research, deployment, retrieval, and product engineering.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee" />
      <stop offset="1" stop-color="#a3e635" />
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity="0.08" />
    </pattern>
  </defs>
  <rect width="1200" height="270" rx="20" fill="#0b1324" />
  <rect width="1200" height="270" rx="20" fill="url(#dots)" />
  <rect x="42" y="36" width="1116" height="3" rx="1.5" fill="url(#accent)" />

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(42 68)">
      <text fill="#67e8f9" font-size="12" font-weight="750" letter-spacing="1.6">RESEARCH</text>
      <text y="36" fill="#f8fafc" font-size="18" font-weight="680">PyTorch</text>
      <text y="66" fill="#cbd5e1" font-size="14">Gymnasium · MuJoCo · Minari</text>
      <text y="94" fill="#cbd5e1" font-size="14">Transformers · MONAI · W&amp;B</text>
      <text y="128" fill="#64748b" font-size="12">training, ablations, multi-seed evaluation</text>
    </g>

    <line x1="318" y1="68" x2="318" y2="222" stroke="#27364d" />
    <g transform="translate(352 68)">
      <text fill="#7dd3fc" font-size="12" font-weight="750" letter-spacing="1.6">DEPLOYMENT</text>
      <text y="36" fill="#f8fafc" font-size="18" font-weight="680">ONNX · TensorRT</text>
      <text y="66" fill="#cbd5e1" font-size="14">ONNX Runtime · WebGPU</text>
      <text y="94" fill="#cbd5e1" font-size="14">NVML · GitHub Actions</text>
      <text y="128" fill="#64748b" font-size="12">latency, throughput, power, client-side inference</text>
    </g>

    <line x1="626" y1="68" x2="626" y2="222" stroke="#27364d" />
    <g transform="translate(660 68)">
      <text fill="#86efac" font-size="12" font-weight="750" letter-spacing="1.6">RETRIEVAL</text>
      <text y="36" fill="#f8fafc" font-size="18" font-weight="680">LangChain · ChromaDB</text>
      <text y="66" fill="#cbd5e1" font-size="14">document pipelines · vector search</text>
      <text y="94" fill="#cbd5e1" font-size="14">retrieval and groundedness evaluation</text>
      <text y="128" fill="#64748b" font-size="12">production RAG over 5,000+ documents</text>
    </g>

    <line x1="932" y1="68" x2="932" y2="222" stroke="#27364d" />
    <g transform="translate(966 68)">
      <text fill="#bef264" font-size="12" font-weight="750" letter-spacing="1.6">PRODUCT</text>
      <text y="36" fill="#f8fafc" font-size="18" font-weight="680">Python · TypeScript</text>
      <text y="66" fill="#cbd5e1" font-size="14">React · Next.js · Dexie</text>
      <text y="94" fill="#cbd5e1" font-size="14">SQL · Supabase · PWA</text>
      <text y="128" fill="#64748b" font-size="12">demos, offline-first apps, technical writing</text>
    </g>
  </g>

  <rect x="0.75" y="0.75" width="1198.5" height="268.5" rx="19.25" fill="none" stroke="#334155" stroke-width="1.5" />
</svg>
